<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Error Occurred</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .error-container {
            max-width: 550px;
            width: 100%;
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            border-top: 5px solid #dc3545;
        }

        .error-icon {
            font-size: 50px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #212529;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .btn-home {
            display: inline-block;
            background-color: #0056b3;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 25px;
            font-weight: 600;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

            .btn-home:hover {
                background-color: #004085;
            }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1>An Error Occurred</h1>
        <p>
            We are sorry, but something went wrong on our system, or the requested page is temporarily unavailable.
            Our technical team has been automatically notified.
        </p>
        <a href="Login.aspx" class="btn-home">Go to Homepage</a>
    </div>

</body>
</html>
