    <script>
        var map = L.map('map').setView([40.91, -96.63], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var marker;
        var arcgisOnline = L.esri.Geocoding.arcgisOnlineProvider();
        var searchResults, searchControl;
        searchControl = L.esri.Geocoding.geosearch({
            providers: [
                arcgisOnline,
                L.esri.Geocoding.featureLayerProvider({
                    url: 'https://services.arcgis.com/uCXeTVveQzP4IIcx/arcgis/rest/services/gisday/FeatureServer/0/',
                    searchFields: ['Name', 'Organization'],
                    label: 'GIS Day Events',

                        // return feature.properties.Name + ' - ' + feature.properties.Organization;
                    }
                })
            ]
        }).addTo(map);
       
        searchControl.on('results', function (data) {
            // searchResults.clearLayers();
            if (marker != null) {
                map.removeLayer(marker);
            }
          
            if (data.results.length > 0) {
                map.setView(data.results[0].latlng, 15);
                var ttip = "";
                ttip += "<div style='border:solid 1px #ddd;border-radius: 5px 5px 0px 0px;'><div style='border-bottom:solid 1px #ddd; padding:5px; text-align:center; background-color:#ecebeb;border-radius: 5px 5px 0px 0px;'>Details</div>";
                ttip += "<div style='border-bottom:solid 1px #ddd; padding: 5px;'><b>Description : </b>" + data.results[0].text + "</div>";
                ttip += "<div style='border-bottom:solid 1px #ddd; padding: 5px;'><b>Lat : </b>" + data.latlng.lat + "</div>";
                ttip += "<div style='border-bottom:solid 1px #ddd; padding: 5px;'><b>Long : </b>" + data.latlng.lng + "</div></div>";

                $("#Latitude").val(data.latlng.lat);
                $("#Longitude").val(data.latlng.lng);

                marker = new L.marker(data.results[0].latlng, {
                    draggable: 'true'
                }).addTo(map).bindPopup(ttip).openPopup();
                CallMarkerEvent();
                //results.addLayer(
                //    marker//.bindPopup(ttip).openPopup()
                //)
                //  var popup = L.popup({ closeOnClick: true }).setLatLng(data.results[0].latlng).setContent(data.results[0].text).openOn(map);

            }

        });

        function CallMarkerEvent() {
         
            marker.on('dragend', function (event) {
                var position = marker.getLatLng();
                marker.setLatLng(position, {
                    draggable: 'true'
                }).bindPopup(position.lat + ' , ' + position.lng).openPopup();
                $("#Latitude").val(position.lat);
                $("#Longitude").val(position.lng).keyup();
                Get_AddressLatLng(position.lat, position.lng);
            });

            //$("#Latitude, #Longitude").change(function () {
            //    var position = [parseInt($("#Latitude").val()), parseInt($("#Longitude").val())];
            //    marker.setLatLng(position, {
            //        draggable: 'true'
            //    });//.bindPopup(position).openPopup();
            //    map.panTo(position);
            //});
        }

        function LatLong_GetAddress() {
            var msg = ($('[id*=Latitude]').val() == "" ? "- Please enter Latitude" : "");
            msg += (msg.length > 0 ? " \r\n" : "") + ($('[id*=Longitude]').val() == "" ? "- Please enter Longitude" : "");
            if (msg == "") {
                Get_AddressLatLng($('[id*=Latitude]').val(), $('[id*=Longitude]').val());
            }
            else {
                alert(msg);
            }
        }
        function Get_AddressLatLng(LatV, LngV) {
            if (marker != null) {
                map.removeLayer(marker);
            }
            var geocodeService = L.esri.Geocoding.geocodeService();
            var message, ttip = "";
            geocodeService.reverse().latlng([LatV, LngV]).run(function (error, result) {
                message = result.address.Match_addr;

                ttip += "<div style='border:solid 1px #ddd;border-radius: 5px 5px 0px 0px;'><div style='border-bottom:solid 1px #ddd; padding:5px; text-align:center; background-color:#ecebeb;border-radius: 5px 5px 0px 0px;'>Details</div>";
                ttip += "<div style='border-bottom:solid 1px #ddd; padding: 5px;'><b>Description : </b>" + message + "</div>";
                ttip += "<div style='border-bottom:solid 1px #ddd; padding: 5px;'><b>Lat : </b>" + result.latlng.lat + "</div>";
                ttip += "<div style='border-bottom:solid 1px #ddd; padding: 5px;'><b>Long : </b>" + result.latlng.lng + "</div></div>";

                $("#Latitude").val(result.latlng.lat);
                $("#Longitude").val(result.latlng.lng);

                marker = new L.marker(result.latlng, {
                    draggable: 'true'
                }).addTo(map).bindPopup(ttip).openPopup();
                map.setView(result.latlng, 15);
                CallMarkerEvent();
            });


        }
        function LatLong_Reset() {
            $('[id*=Latitude]').val('17.174380000000042'); $('[id*=Longitude]').val('75.95434000000006');
        }
